<ion-content [fullscreen]="true">
  <main class="logo-page">
    <div class="logo-stage">
      <span class="logo-halo" aria-hidden="true"></span>
      <img
        class="logo-image"
        [src]="logoSrc"
        [style.width.px]="size"
        [style.height.px]="size"
        alt="Logo NEYA"
      />
    </div>

    <h1>NEYA</h1>
    <p>Informer. Comprendre. Orienter. Agir.</p>
    <button
      type="button"
      class="sound-choice"
      [class.is-off]="!audio.enabled()"
      [attr.aria-pressed]="audio.enabled()"
      (click)="audio.setEnabled(!audio.enabled())"
    >
      <ion-icon [name]="audio.enabled() ? 'volume-high-outline' : 'volume-mute-outline'" aria-hidden="true" />
      {{ audio.enabled() ? 'Son activé' : 'Son coupé' }}
    </button>
    <section class="language-picker" aria-label="Langue de l’application">
      <app-talking-tiles
        [tiles]="languageTiles"
        [running]="tilesRunning()"
        [selected]="[language]"
        (chosen)="chooseLanguage($event)"
      />
    </section>
    <ion-button class="continue-button" routerLink="/tabs/info">Continuer</ion-button>
    <a class="professional-link" routerLink="/professional-access">
      Vous représentez une structure ou êtes médecin ? Inscrivez-vous
    </a>
  </main>
</ion-content>
